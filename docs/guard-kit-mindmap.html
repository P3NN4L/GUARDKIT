<title>guard-kit · 反诈引擎脑图（雷达 v7）</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "PingFang HK", "PingFang SC", "Noto Sans CJK HK", "Microsoft YaHei", sans-serif; background: #F4F7F9; overflow: auto; }
  #wrap { position: relative; width: 2160px; height: 2080px; margin: 20px auto; }
  svg.links { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .node { position: absolute; border-radius: 10px; padding: 8px 14px; font-size: 14px; line-height: 1.45; box-shadow: 0 1px 4px rgba(20,40,60,.12); }
  .center { background: #16323F; color: #fff; font-size: 21px; font-weight: 700; padding: 16px 22px; border-radius: 14px; text-align: center; box-shadow: 0 4px 14px rgba(22,50,63,.35); }
  .center small { display: block; font-size: 12px; font-weight: 400; opacity: .85; margin-top: 4px; }
  .branch { color: #fff; font-weight: 700; font-size: 16px; padding: 10px 16px; }
  .leaf { background: #fff; color: #233; border-left: 4px solid #999; max-width: 348px; }
  .leaf b { color: #10404F; }
  .leaf code { background: #EDF3F6; border-radius: 4px; padding: 0 5px; font-size: 12.5px; font-family: "SF Mono", Menlo, monospace; }
  .sub { background: #EDF3F6; color: #345; border: 1px solid #D5E2E9; max-width: 330px; font-size: 13px; }
  .b1 { background: #2C6E8F; } .b2 { background: #8F5A2C; } .b3 { background: #4A7B96; }
  .b4 { background: #34756B; } .b5 { background: #7A5C8F; } .b6 { background: #45622E; } .b7 { background: #8F2C4E; }
</style>
</head>
<body>
<div id="wrap">
  <svg class="links" id="links"></svg>
  <div id="nodes"></div>
</div>
<script>
const DATA = [
 { side: 'R', cls: 'b1', title: '双模型（端内权重）<br><small style="font-weight:400">雷达 852KB · 裁判 285KB</small>', x: 1130, y: 40, leaves: [
   { t: '<b>雷达 v7 · 消息风险</b>', kids: ['输出：校准概率 + 原始证据分 + 三档（高危/可疑/放行）+ 骗术大类 + 百分值 0-100 整数', '档位双条件：校准置信与原始证据同时达标（高危 0.75×0.505 / 可疑 0.35×0.455，抗校准灰区膨胀）'] },

   { t: '<b>裁判 v5 · 回复质量</b>', kids: ['四意图（反击/拖延/配合/无效）+ 星级 + 校准置信度', '置信度&lt;0.5 时建议界面显示中性、不评星'] },
 ]},
 { side: 'R', cls: 'b2', title: 'LLM 配置（MiniMax）<br><small style="font-weight:400">few-shot 对照 · 蒸馏管线</small>', x: 1130, y: 780, leaves: [
   { t: '<b>few-shot 对照配置</b>', kids: ['MiniMax 平台对话接口 · 模型 abab6.5s-chat（经济型）与 MiniMax-M3（旗舰推理）', 'temperature 0.1 · 输出上限按用途区分 · 严格 JSON 判定输出（骗局/非骗局 + 置信度）', '提示内嵌 4 个标注例（HK 风格 2 骗 + 2 正常：假郵政/家人日常/假HSBC/室友分賬）', 'M3 为推理模型：输出上限 1500，结论取正文（空则取推理结论）；零样本/少样本与经济型用同一提示模板；速率限制下串行退避'] },
   { t: '<b>对照结果</b>', kids: ['公开 120 条：雷达 92.7/3.1 ≫ abab zero-shot 74.5/13.8 ≫ few-shot 54.5/4.6 ≫ M3 56.4 & 58.2 ≫ 关键词 1.8/0', 'HK 真实案例：M3 few-shot 100%/0% 完美但秒级联网计费——雷达 0.04ms 离线守第一道，融合分工'] },
   { t: '<b>蒸馏管线（语料生成）</b>', kids: ['temperature 1.0 · max_tokens 3000 · 每批 24 条 JSON 数组 · 6 轮按误报画像', '输出过滤：长度 8-340 · 归一化去重 · scam 侧剔除官方劝阻词 · 原始响应存档可审计'] },
   { t: '<b>安全边界</b>', kids: ['密钥仅环境变量注入（源码零凭据）；HTTP 由操作者 curl 出站，仓库零网络代码'] },
 ]},
 { side: 'R', cls: 'b3', title: '六平台接入<br><small style="font-weight:400">同一权重逐位一致 ≤1e-6</small>', x: 1130, y: 1460, leaves: [
   { t: '<b>TS / React Native · Expo</b>', kids: ['双模型打包，或仅接雷达（裁判权重不进包，省 285KB）· 百分值便捷接口'] },
   { t: '<b>原生三端</b>', kids: ['iOS：原生组件包（雷达 / 裁判 / 百分值 / 多轮语境）', 'Android：资产内置权重 + 单文件组件，零第三方依赖', 'Flutter：依赖包集成（内置 Unicode 规一化）'] },
   { t: '<b>小程序 · 云端</b>', kids: ['微信小程序：分包内置权重', '云端四接口：消息评分 / 回复评分 / 会话语境 / 健康检查'] },
 ]},
 { side: 'L', cls: 'b4', title: '推理内核<br><small style="font-weight:400">纯函数 · 零依赖 · 0.04ms</small>', x: 420, y: 40, leaves: [
   { t: '<b>特征</b>', kids: ['char 1-3 gram TF-IDF（码点级，emoji 安全）· 12,000 特征 · 四语配额（EN≥25%）'] },
   { t: '<b>模型</b>', kids: ['softmax 逻辑回归（4 类：normal + 冒充/先付/诱饵）+ sublinear tf + L2'] },
   { t: '<b>校准</b>', kids: ['Platt：分组分层 OOF 拟合 · 温度上限 a≤6（防灰区膨胀）· ECE 如实报告'] },
   { t: '<b>确定性规则层</b>', kids: ['反诈讨论白名单 v2（主题词+建议词双条件）', '官方域名规则：gov.hk/郵政/銀行官網 × 无 .top//icu/ 等可疑记号 → 放行（骗子必带假域名，结构互斥）', '规则在全部 10 处引擎逐字镜像 · 2 万+ scam 行验证 0 误放行'] },
 ]},
 { side: 'L', cls: 'b5', title: '训练与进化<br><small style="font-weight:400">宁可不升级，不带病发布</small>', x: 420, y: 840, leaves: [
   { t: '<b>语料三源 · 12,832 行</b>', kids: ['手写模板 247（ADCC/警务處/公安部真实案例）', 'LLM 蒸馏 1,416（骗 652/正 764，六轮）', '公开真实 9,274（UCI 5,574 英文 + 80 万中文分层）+ 增强 2,142'] },
   { t: '<b>训练要件</b>', kids: ['语言 sqrt 平衡（防单一语言域翻转）· StratifiedGroupKFold OOF · EN 配额剪枝'] },
   { t: '<b>诚实协议</b>', kids: ['盲测卷 v1→v8-hk 训练前盲写 · 退役入训 ×2 · 错误台账全记', '门禁：不回退/误报关卡/诚实卷底线，不过自动回滚全部工件'] },
 ]},
 { side: 'L', cls: 'b6', title: '基准与指标<br><small style="font-weight:400">全部 held-out 可复现</small>', x: 420, y: 1480, leaves: [
   { t: '<b>公开真实短信（5 切片）</b>', kids: ['中文诈骗召回 90.2%（v5 52.2）· 高危档 84.9%', '真实正常误报 0.2%-7.1%（v5 10.6-25.1）'] },
   { t: '<b>HK 真实案例卷</b>', kids: ['12 家族（ADCC/資科辦/SCMP/警方逐条标出处）零样本 12/12 全高危（校准分≥0.9）'] },
   { t: '<b>三方对照（120 条）</b>', kids: ['雷达 92.7/3.1 ≫ abab zero-shot 74.5/13.8 ≫ few-shot 54.5/4.6 ≫ M3 56.4 & 58.2 ≫ 关键词 1.8/0', 'HK 集：雷达 100% 与 M3 few-shot（100%/0%）持平量级，但 0.04ms 离线免费 vs 秒级联网'] },
 ]},
 { side: 'L', cls: 'b7', title: '交付', x: 420, y: 1860, leaves: [
   { t: '<b>仓库分层</b>', kids: ['主仓（引擎+训练全量）· 比赛仓 runtime-only 子集 · GUARDKIT 接入指南（中英）'] },
   { t: '<b>契约</b>', kids: ['权重文件即换即用（文件名与版本解耦，代码零改动）· MIT · 中英文档'] },
 ]},
];
const wrap = document.getElementById('wrap');
const nodesEl = document.getElementById('nodes');
const svg = document.getElementById('links');
const EDGE = [];
function addNode(html, cls, x, y, w) {
  const el = document.createElement('div');
  el.className = 'node ' + cls;
  el.innerHTML = html;
  if (w) el.style.width = w + 'px';
  el.style.left = x + 'px'; el.style.top = y + 'px';
  nodesEl.appendChild(el);
  requestAnimationFrame(draw);
  return el;
}
function edge(x1, y1, x2, y2, color) { EDGE.push({ x1, y1, x2, y2, color }); }
function draw() {
  svg.innerHTML = EDGE.map(e => {
    const mx = (e.x1 + e.x2) / 2;
    return `<path d="M${e.x1},${e.y1} C${mx},${e.y1} ${mx},${e.y2} ${e.x2},${e.y2}" fill="none" stroke="${e.color}" stroke-width="1.8" opacity=".55"/>`;
  }).join('');
}
const cx = 1070, cy = 1030;
addNode('guard-kit 反诈打分引擎<small>雷达 v7 · 裁判 v5 · 六平台 · 离线 0.04ms · 零幻觉</small>', 'center', cx - 140, cy - 34, 280);
const COLORS = { b1: '#2C6E8F', b2: '#8F5A2C', b3: '#4A7B96', b4: '#34756B', b5: '#7A5C8F', b6: '#45622E', b7: '#8F2C4E' };
DATA.forEach(br => {
  const bw = 300;
  const color = COLORS[br.cls];
  const b = addNode(br.title, 'node branch ' + br.cls, br.x, br.y, bw);
  edge(cx + (br.side === 'R' ? 140 : -140), cy, br.x + (br.side === 'R' ? 0 : bw), br.y + 26, color);
  let ly = br.y + 66;
  (br.leaves || []).forEach(leaf => {
    const l = addNode(leaf.t, 'leaf ' + br.cls, br.x + 6, ly, br.side === 'R' ? 330 : 344);
    edge(br.x + (br.side === 'R' ? 0 : bw), br.y + 26, br.x + 6 + (br.side === 'R' ? 0 : 338), ly + 16, color);
    ly += l.offsetHeight + 8;
    (leaf.kids || []).forEach(k => {
      const kx = br.side === 'R' ? br.x + 360 : br.x - 316;
      const s = addNode(k, 'sub', kx, ly, 306);
      edge(br.x + (br.side === 'R' ? 336 : -6), ly - 8, kx + (br.side === 'R' ? 0 : 306), ly + 14, color);
      ly += s.offsetHeight + 6;
    });
    ly += 6;
  });
});
</script>
</body>
</html>
